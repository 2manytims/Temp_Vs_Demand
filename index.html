<script>
  const AUS_LOCATIONS = [
    {name:"Adelaide",  demandKey:"Adelaide",  label:"SA demand"},
    {name:"Archerfield",demandKey:"Archerfield",label:"QLD demand"},
    {name:"Bankstown", demandKey:"Bankstown", label:"NSW demand"},
    {name:"Melbourne", demandKey:"Melbourne", label:"VIC demand"},
  ];

  const JPN_LOCATIONS = [
    {name:"Tokyo",      demandKey:"Tokyo",      label:"Tokyo demand"},
    {name:"Osaka",      demandKey:"Osaka",      label:"Kansai demand"},
    {name:"Nagoya",     demandKey:"Nagoya",     label:"Chuubu demand"},
    {name:"Fukuoka",    demandKey:"Fukuoka",    label:"Kyushu demand"},
    {name:"Sapporo",    demandKey:"Sapporo",    label:"Hokkaido demand"},
    {name:"Sendai",     demandKey:"Sendai",     label:"Tohoku demand"},
    {name:"Hiroshima", demandKey:"Hiroshima", label:"Chuugoku demand"},
    {name:"Matsuyama", demandKey:"Matsuyama", label:"Shikoku demand"},
    {name:"Kanazawa",  demandKey:"Kanazawa",  label:"Hokuriku demand"},
  ];

  const AUS_STATION_INFO = {
    Adelaide:{old:"Kent Town (023090)",current:"West Terrace (023000)",cutYear:2017,
      note:"Observations before 2017 are from <strong>Kent Town station</strong>. From 2017: <strong>West Terrace</strong>."},
    Melbourne:{old:"Regional Office (086071)",current:"Olympic Park (086338)",cutYear:2013,
      note:"Observations before 2013 are from <strong>Regional Office</strong>. From 2013: <strong>Olympic Park</strong>."},
  };

  const AUS_SEASONS = {1:"summer",2:"summer",3:"autumn",4:"autumn",5:"autumn",6:"winter",7:"winter",8:"winter",9:"spring",10:"spring",11:"spring",12:"summer"};
  const JPN_SEASONS = {1:"winter",2:"winter",3:"spring",4:"spring",5:"spring",6:"summer",7:"summer",8:"summer",9:"autumn",10:"autumn",11:"autumn",12:"winter"};
  const SEASON_LABEL = {summer:"Summer",autumn:"Autumn",winter:"Winter",spring:"Spring"};
  const MONTH_NAMES = ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTH_FULL  = ["","January","February","March","April","May","June","July","August","September","October","November","December"];

  let country    = "aus";
  let mode       = "search";
  let ausObs     = null, ausdem = null;
  let jpnObs     = null, jpndem = null;
  let allResults = [], currentPage = 1;
  const PAGE_SIZE = 25;

  // Initialize dropdowns on load
  window.onload = () => {
    populateLocationDropdowns();
    document.getElementById("date-input").value = new Date().toISOString().slice(0,10);
  };

  function setCountry(c) {
    country = c;
    document.getElementById("btn-aus").classList.toggle("active", c==="aus");
    document.getElementById("btn-jpn").classList.toggle("active", c==="jpn");
    populateLocationDropdowns();
    document.getElementById("inp-threshold").value   = c==="aus" ? 40 : 35;
    document.getElementById("streak-threshold").value = c==="aus" ? 35 : 30;
    updateStationNote();
    document.getElementById("results-area").innerHTML = "";
    allResults = []; currentPage = 1;
  }

  function setMode(m) {
    mode = m;
    document.getElementById("panel-search").style.display = m==="search" ? "block" : "none";
    document.getElementById("panel-date").style.display   = m==="date"   ? "block" : "none";
    document.getElementById("panel-streak").style.display = m==="streak" ? "block" : "none";
    document.getElementById("tab-search").classList.toggle("active", m==="search");
    document.getElementById("tab-date").classList.toggle("active", m==="date");
    document.getElementById("tab-streak").classList.toggle("active", m==="streak");
    document.getElementById("results-area").innerHTML = "";
    allResults = []; currentPage = 1;
  }

  function populateLocationDropdowns() {
    const locs = country==="aus" ? AUS_LOCATIONS : JPN_LOCATIONS;
    ["sel-location","date-location","streak-location"].forEach(id => {
      const sel = document.getElementById(id);
      if(sel) sel.innerHTML = locs.map(l => `<option value="${l.name}">${l.name}</option>`).join("");
    });
    updateStationNote();
  }

  function updateStationNote() {
    const el = document.getElementById("station-note");
    if(country !== "aus") { el.style.display="none"; return; }
    const loc = document.getElementById("sel-location").value;
    const info = AUS_STATION_INFO[loc];
    if(info) {
      el.innerHTML = `ℹ️ &nbsp;${info.note}<br>
        <span style="margin-top:5px;display:inline-block;">
          Before ${info.cutYear}: <span class="station-badge-old">${info.old}</span>
          &nbsp; From ${info.cutYear}+: <span class="station-badge-cur">${info.current}</span>
        </span>`;
      el.style.display = "block";
    } else {
      el.style.display = "none";
    }
  }

  // Mock data loaders (Assuming JSON files exist in your directory)
  async function loadObs() {
    // Note: This will fail unless run on a web server with actual .json files
    try {
      if(country==="aus" && !ausObs) { ausObs = {}; return true; } 
      if(country==="jpn" && !jpnObs) { jpnObs = {}; return true; }
      return true;
    } catch(e) { showError("Data source not found."); return false; }
  }

  async function loadDemand() { return true; }

  function yearsAgo(y) {
    const diff = new Date().getFullYear() - y;
    return diff === 0 ? "This year" : `${diff} years ago`;
  }

  function showError(msg) { 
    document.getElementById("results-area").innerHTML=`<div class="empty"><h3>${msg}</h3></div>`; 
  }

  function showLoading(msg){ 
    document.getElementById("results-area").innerHTML=`<div class="loading">${msg}</div>`; 
  }

  function runSearch() {
    // Placeholder for actual search logic
    const area = document.getElementById("results-area");
    area.innerHTML = `<div class="empty"><h3>Search function ready</h3><p>Ensure your JSON data files are hosted to see records.</p></div>`;
  }

  function runDateLookup() {
    const loc = document.getElementById("date-location").value;
    const date = document.getElementById("date-input").value;
    const area = document.getElementById("results-area");
    area.innerHTML = `<div class="date-lookup-card"><h3>${loc} - ${date}</h3><p>Data lookup triggered.</p></div>`;
  }

  function runStreakSearch() {
     const area = document.getElementById("results-area");
     area.innerHTML = `<div class="empty"><h3>Streak Search triggered</h3></div>`;
  }
</script>
</body>
</html>
